<!DOCTYPE html>
<html>
<head>
<title>Sonam's Calculator</title>
<style>
body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; }
.calculator { background: #222; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
#display { width: 100%; height: 60px; font-size: 28px; text-align: right; padding: 10px; box-sizing: border-box; border: none; border-radius: 10px; margin-bottom: 15px; }
.buttons { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; }
button { height: 60px; font-size: 22px; border: none; border-radius: 10px; cursor: pointer; }
.num { background: #444; color: white; }
.op { background: #ff9500; color: white; }
.equal { background: #28a745; color: white; grid-column: span 2; }
.clear { background: #dc3545; color: white; }
button:active { transform: scale(0.95); }
h2 { color: white; text-align: center; margin-top: 0; }
</style>
</head>
<body>

<div class="calculator">
<h2>Sonam's Calculator</h2>
<input type="text" id="display" disabled>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button class="op" onclick="appendValue('/')">/</button>
<button class="op" onclick="appendValue('')"></button>
<button class="op" onclick="appendValue('-')">-</button>

<button class="num" onclick="appendValue('7')">7</button>
<button class="num" onclick="appendValue('8')">8</button>
<button class="num" onclick="appendValue('9')">9</button>
<button class="op" onclick="appendValue('+')">+</button>

<button class="num" onclick="appendValue('4')">4</button>
<button class="num" onclick="appendValue('5')">5</button>
<button class="num" onclick="appendValue('6')">6</button>
<button class="num" onclick="appendValue('1')">1</button>

<button class="num" onclick="appendValue('2')">2</button>
<button class="num" onclick="appendValue('3')">3</button>
<button class="num" onclick="appendValue('0')">0</button>
<button class="num" onclick="appendValue('.')">.</button>

<button class="equal" onclick="calculate()">=</button>
</div>
</div>

<script>
let display = document.getElementById('display');
function appendValue(val) { display.value += val; }
function clearDisplay() { display.value = ''; }
function calculate() {
  try { display.value = eval(display.value); }
  catch { display.value = 'Error'; }
}
</script>

</body>
</html>
